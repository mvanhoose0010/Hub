<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multi-Tool Dashboard</title>
    <style>
        /* --- PAGE LAYOUT --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Essential: stops the main page from having scrollbars */
        }

        /* --- NAVIGATION BAR --- */
        .tab-nav {
            background-color: #2c3e50; /* Dark Blue-Grey */
            overflow: hidden;
            height: 50px; 
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            position: relative;
        }

        .tab-nav button {
            background-color: transparent;
            color: #ecf0f1;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0 25px;
            height: 100%;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s;
            border-bottom: 4px solid transparent; /* For active styling */
        }

        .tab-nav button:hover {
            background-color: #34495e;
        }

        .tab-nav button.active {
            background-color: #34495e;
            border-bottom: 4px solid #27ae60; /* Green accent for active tab */
        }

        /* --- IFRAME CONTAINER --- */
        .iframe-container {
            /* Height is 100% of viewport - 50px for the nav bar */
            height: calc(100vh - 50px); 
            width: 100%;
            background-color: #f4f4f4;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* All hidden by default */
        }
    </style>
</head>
<body>

    <div class="tab-nav">
        <button class="tab-links" onclick="openTab(event, 'tab1')" id="defaultOpen">Final</button>
        
        <button class="tab-links" onclick="openTab(event, 'tab2')">Lot Generator</button>
        
        <button class="tab-links" onclick="openTab(event, 'tab3')">Copy</button>
        
        <button class="tab-links" onclick="openTab(event, 'tab4')">Day</button>
    </div>

    <iframe 
        id="tab1" 
        src="https://mvanhoose0010.github.io/final/"
        allow="clipboard-read; clipboard-write">
    </iframe>

    <iframe 
        id="tab2" 
        src="https://mvanhoose0010.github.io/Lot-Generator/"
        allow="clipboard-read; clipboard-write">
    </iframe>

    <iframe 
        id="tab3" 
        src="https://mvanhoose0010.github.io/copy/"
        allow="clipboard-read; clipboard-write">
    </iframe>

    <iframe 
        id="tab4" 
        src="https://mvanhoose0010.github.io/day/"
        allow="clipboard-read; clipboard-write">
    </iframe>


    <script>
        function openTab(evt, tabId) {
            // 1. Hide all iframes
            var i, iframes, tablinks;
            iframes = document.getElementsByTagName("iframe");
            for (i = 0; i < iframes.length; i++) {
                iframes[i].style.display = "none";
            }

            // 2. Remove "active" class from all buttons
            tablinks = document.getElementsByClassName("tab-links");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            // 3. Show the current iframe and highlight the button
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Automatically click the default tab on load
        document.getElementById("defaultOpen").click();
    </script>

</body>
</html>
